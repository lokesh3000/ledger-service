spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12!@asAS}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

ledger:
  reconciliation:
    initial-delay-ms: 30000
    interval-ms: 300000   # run the consistency check every 5 minutes
